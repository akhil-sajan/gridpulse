# Bronze (P1.5), silver (P2.1) and the SCD2 power-plant dimension (P3.4) in one serverless, triggered pipeline. Free Edition
# allows one active pipeline per type, and one pipeline lets Databricks order the steps
# from the table dependencies. (The resource key stays "bronze" so the existing pipeline
# and its tables are kept.) The daily job that runs it is in refresh.job.yml.
resources:
  pipelines:
    bronze:
      name: gridpulse_medallion
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../src/bronze/bronze_pipeline.py
        - file:
            path: ../src/bronze/kafka_bronze.py
        - file:
            path: ../src/silver/silver_pipeline.py
        - file:
            path: ../src/gold/power_plant_pipeline.py
        - file:
            path: ../src/silver/stream_silver.py
        - file:
            path: ../src/ops/stream_metrics.py
        - file:
            path: ../src/ops/dq_checks.py
      configuration:
        gridpulse.catalog: ${var.catalog}
        # Bundle root on the workspace: the pipeline files import src/utils/transforms.py (P5.3).
        gridpulse.repo_root: ${workspace.file_path}
        gridpulse.secret_scope: gridpulse
        # P4.7: false = streams arrive only as files (no connection to Redpanda).
        gridpulse.kafka_enabled: ${var.kafka_enabled}
        gridpulse.landing_root: /Volumes/${var.catalog}/bronze/landing
        spark.sql.session.timeZone: UTC
