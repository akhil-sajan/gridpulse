name: MaStR change simulator (manual fallback)

# P3.2: make one day of realistic changes to the power-plant register in Neon Postgres.
# The daily run is the Databricks job gridpulse_mastr_simulator (04:10 UTC): GitHub's
# scheduler started this workflow 10 hours late on 2026-11-23. This workflow stays as a
# manual way to add changes from outside Databricks.
# Needs the GRIDPULSE_PG_DSN repository secret (Neon direct endpoint, not -pooler).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mastr-simulator
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Simulate one day of register changes
        env:
          GRIDPULSE_PG_DSN: ${{ secrets.GRIDPULSE_PG_DSN }}
          PYTHONUNBUFFERED: "1"
        run: python -m ingestion.batch.mastr_simulator
