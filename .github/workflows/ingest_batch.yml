name: Ingest batch (manual fallback)

# Manual backup for the batch ingesters. Scheduled ingestion runs in Databricks Jobs
# (gridpulse_refresh daily, gridpulse_forecast every 3 hours), because GitHub's
# scheduler is best-effort: scheduled runs can be delayed or dropped under load,
# which dropped our daily run on 2026-11-22. This workflow stays as a way to
# run an ingester from outside Databricks (e.g. if the workspace is unavailable).
# Needs the DATABRICKS_HOST and DATABRICKS_TOKEN repository secrets.

on:
  workflow_dispatch:
    inputs:
      task:
        description: Which ingester to run
        type: choice
        options: [all, forecast, smard, open_meteo_archive]
        default: all

permissions:
  contents: read

env:
  GRIDPULSE_ENV: dev
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  forecast:
    if: inputs.task == 'all' || inputs.task == 'forecast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: ingest-forecast, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Open-Meteo forecast
        run: python -m ingestion.batch.open_meteo forecast

  smard:
    if: inputs.task == 'all' || inputs.task == 'smard'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: ingest-smard, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: SMARD
        run: python -m ingestion.batch.smard --workers 4

  open_meteo_archive:
    if: inputs.task == 'all' || inputs.task == 'open_meteo_archive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: ingest-open-meteo-archive, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Open-Meteo archive
        run: python -m ingestion.batch.open_meteo archive
