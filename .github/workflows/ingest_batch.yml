name: Ingest batch

# Runs the batch ingesters on GitHub's servers and lands raw files in the
# Unity Catalog landing volume (backed by our S3 bucket).
#
#   every 3 hours  Open-Meteo forecast (next ~48 h, 16 locations)
#   daily 04:23    SMARD (open weeks) and Open-Meteo archive (open months)
#
# Times are UTC. Minutes are off the hour because GitHub delays jobs scheduled at :00.
# Note: GitHub disables schedules in public repos after 60 days without repository
# activity; any push re-enables them.

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Which ingester to run
        type: choice
        options: [all, forecast, smard, open_meteo_archive]
        default: all

permissions:
  contents: read

env:
  GRIDPULSE_ENV: dev
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  forecast:
    if: github.event.schedule == '17 */3 * * *' || inputs.task == 'all' || inputs.task == 'forecast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: ingest-forecast, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Open-Meteo forecast
        run: python -m ingestion.batch.open_meteo forecast

  smard:
    if: github.event.schedule == '23 4 * * *' || inputs.task == 'all' || inputs.task == 'smard'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: ingest-smard, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: SMARD
        run: python -m ingestion.batch.smard --workers 4

  open_meteo_archive:
    if: github.event.schedule == '23 4 * * *' || inputs.task == 'all' || inputs.task == 'open_meteo_archive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: ingest-open-meteo-archive, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Open-Meteo archive
        run: python -m ingestion.batch.open_meteo archive
