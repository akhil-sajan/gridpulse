# Bronze (P1.5) and silver (P2.1) in one serverless, triggered pipeline. Free Edition
# allows one active pipeline per type, and one pipeline lets Databricks order the steps
# from the table dependencies. (The resource key stays "bronze" so the existing pipeline
# and its tables are kept.) The daily job that runs it is in refresh.job.yml.
resources:
  pipelines:
    bronze:
      name: gridpulse_medallion
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../src/bronze/bronze_pipeline.py
        - file:
            path: ../src/silver/silver_pipeline.py
      configuration:
        gridpulse.catalog: ${var.catalog}
        gridpulse.landing_root: /Volumes/${var.catalog}/bronze/landing
        spark.sql.session.timeZone: UTC
