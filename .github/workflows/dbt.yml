name: dbt (manual)

# Runs dbt against the Databricks SQL warehouse from GitHub's servers.
# Needs the DATABRICKS_HOST, DATABRICKS_HTTP_PATH and DATABRICKS_TOKEN secrets.

on:
  workflow_dispatch:
    inputs:
      command:
        description: dbt command to run
        type: choice
        options: [debug, source freshness, build, docs generate]
        default: debug
      target:
        description: dbt target
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DBT_TARGET: ${{ inputs.target }}
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dbt.txt }
      - run: pip install -r ../requirements-dbt.txt
      - run: dbt deps
      - name: dbt ${{ inputs.command }}
        run: dbt ${{ inputs.command }}
