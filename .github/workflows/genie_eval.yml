name: Genie benchmark (manual)

# P6.2: asks the Genie space the 10 benchmark questions and compares Genie's answers
# with the reference SQL. The report is attached to the run as an artifact.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which space to test
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Ask Genie the benchmark questions
        run: |
          if [ "${{ inputs.target }}" = "prod" ]; then
            python -m genie.evaluate --catalog gridpulse_prod
          else
            python -m genie.evaluate --catalog gridpulse_dev --title-prefix "[dev] "
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genie-benchmark-${{ inputs.target }}
          path: genie_benchmark.md
