[project]
name = "gridpulse"
version = "0.1.0"
description = "Real-time energy market lakehouse on Databricks: Kafka, Lakeflow, dbt, MLflow"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Globals that Databricks notebooks provide at runtime.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
