version: 2

sources:
  - name: silver
    description: Clean, deduplicated tables built by the Lakeflow pipeline (bronze -> silver).
    database: "{{ target.catalog }}"
    schema: silver
    config:
      # Freshness = when the newest landed file behind a table arrived.
      loaded_at_field: _file_modified_at
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 4, period: day}
    tables:
      - name: smard_generation
        description: SMARD generation per series and 15-minute interval (UTC), MWh.
      - name: smard_consumption
        description: SMARD grid load and residual load per 15-minute interval (UTC), MWh.
      - name: smard_prices
        description: SMARD day-ahead prices DE-LU per hour and quarter-hour (UTC), EUR/MWh.
      - name: openmeteo_weather
        description: Observed hourly weather per state location (UTC).
      - name: openmeteo_forecast
        description: Hourly weather forecasts per location and fetch time.
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 1, period: day}
      - name: ref_production_type
        description: Generation series -> category (renewable, fossil, nuclear, storage).
        config:
          freshness: null
      - name: weather_national_hourly
        description: >
          Germany-wide hourly weather, plain average of the 16 state locations. No longer
          used by dbt since P3.5 (see int_weather_national, capacity-weighted).
        config:
          freshness: null

  - name: lakeflow_gold
    description: Gold tables owned by the Lakeflow pipeline (not by dbt).
    database: "{{ target.catalog }}"
    schema: gold
    tables:
      - name: dim_power_plant
        description: >
          MaStR power plants >= 100 kW, one row per version (SCD Type 2, AUTO CDC).
          __END_AT IS NULL marks the current version.
        config:
          # A daily simulator run changes the register, so the newest version is recent.
          loaded_at_field: updated_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}

  - name: bronze
    description: Raw copies written by job tasks outside the pipeline.
    database: "{{ target.catalog }}"
    schema: bronze
    tables:
      - name: mastr_small_units_agg
        description: >
          MaStR units below 100 kW, summed by type, energy source, state, status and
          commissioning/decommissioning month (snapshot of one export, copied from Neon).
