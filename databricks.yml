# Databricks Asset Bundle for GridPulse.
# The workspace host is not stored here: locally it comes from the CLI profile
# (`-p gridpulse`), in CI from the DATABRICKS_HOST / DATABRICKS_TOKEN secrets.
bundle:
  name: gridpulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog this target writes to
    default: gridpulse_dev
  env:
    description: GRIDPULSE_ENV passed to the ingesters (dev or prod)
    default: dev
  kafka_enabled:
    description: >
      Read the event streams from Kafka (Redpanda) as well as from landing files.
      Set to "false" before the Redpanda cluster is deleted (P4.7).
    default: "true"
  stream_transport:
    description: How the meter replay job sends events, kafka or file (P4.7)
    default: kafka
  # P5.5 ------------------------------------------------------------------------
  warehouse_id:
    description: SQL warehouse the dbt task runs on (Free Edition has exactly one)
    lookup:
      warehouse: Serverless Starter Warehouse
  schedule_status:
    description: UNPAUSED runs the daily/3-hourly schedules, PAUSED leaves them manual-only
    default: UNPAUSED
  backfill_start:
    description: >
      First date the batch ingesters land (empty = start_date from config/*.yaml).
      Prod sets a recent date so it doesn't download six years of history again.
    default: ""
  check_stream:
    description: >
      Check freshness/volume of the live stream. The producers feed dev only,
      so prod (no stream) sets "false".
    default: "true"

targets:
  dev:
    # Development mode prefixes resource names with "[dev <user>]".
    mode: development
    default: true
    # Development mode pauses schedules unless a job sets pause_status itself. Dev is the
    # running environment (prod is manual-only, see below), so the ingestion jobs set
    # pause_status: ${var.schedule_status} (UNPAUSED here).
    resources:
      jobs:
        # P3.2: plays the users of the operational database (Neon). It is not part of the
        # data platform, so it exists only in dev; prod would otherwise double the changes.
        # Runs at 04:10 UTC, before gridpulse_refresh (04:30) extracts the changes.
        mastr_simulator:
          name: gridpulse_mastr_simulator
          schedule:
            quartz_cron_expression: "0 10 4 * * ?"
            timezone_id: UTC
            pause_status: UNPAUSED
          max_concurrent_runs: 1
          email_notifications:
            on_failure:
              - ${workspace.current_user.userName}
          environments:
            - environment_key: simulator
              spec:
                environment_version: "2"
                dependencies:
                  - pg8000>=1.31,<2
          tasks:
            - task_key: simulate_changes
              environment_key: simulator
              timeout_seconds: 600
              spark_python_task:
                python_file: src/jobs/run_ingester.py
                parameters:
                  - ${workspace.file_path}
                  - ${var.env}
                  - ingestion.batch.mastr_simulator

        # P4.3: replays London smart-meter readings to Redpanda (topic meters.readings.v1).
        # Like the simulator it stands in for a source system, so it exists only in dev.
        # No schedule: start it by hand ("Run now with different parameters" to change
        # the window). Reads the CSV from the landing volume, not from the laptop.
        meter_replay:
          name: gridpulse_meter_replay
          max_concurrent_runs: 1
          parameters:
            - name: file
              default: /Volumes/gridpulse_dev/bronze/landing/reference/london_meters/block_0.csv
            - name: start
              default: "2013-01-01"
            - name: days
              default: "1"
            - name: speed
              default: "1440"
            - name: max_meters
              default: "50"
            - name: transport
              default: ${var.stream_transport}
          environments:
            - environment_key: producer
              spec:
                environment_version: "2"
                dependencies:
                  - kafka-python>=3,<4
                  - fastjsonschema>=2.19,<3
          tasks:
            - task_key: replay
              environment_key: producer
              timeout_seconds: 3600
              spark_python_task:
                python_file: src/jobs/run_ingester.py
                parameters:
                  - ${workspace.file_path}
                  - ${var.env}
                  - ingestion.producers.meter_replay
                  - --file
                  - "{{job.parameters.file}}"
                  - --start
                  - "{{job.parameters.start}}"
                  - --days
                  - "{{job.parameters.days}}"
                  - --speed
                  - "{{job.parameters.speed}}"
                  - --max-meters
                  - "{{job.parameters.max_meters}}"
                  - --transport
                  - "{{job.parameters.transport}}"

  # P5.5: deployed by GitHub Actions when a version tag (v*) is pushed.
  # Free Edition allows only 5 concurrent tasks and one active pipeline per type, and has a
  # daily compute quota, so prod is a manual-only copy: schedules paused, a short backfill,
  # no live stream (the producers and Redpanda feed dev). Dev keeps running every day.
  prod:
    mode: production
    variables:
      catalog: gridpulse_prod
      env: prod
      schedule_status: PAUSED
      backfill_start: "2026-11-02"
      kafka_enabled: "false"
      stream_transport: file
      check_stream: "false"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
