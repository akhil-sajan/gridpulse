name: MaStR change simulator

# P3.2: once a day, make a handful of realistic changes to the power-plant register in
# Neon Postgres (new units, commissioning, upgrades, stops, closures), so the CDC
# pipeline (P3.3/P3.4) has fresh changes to pick up. GitHub's scheduler is best-effort;
# a dropped day only means fewer changes, which is harmless here.
# Needs the GRIDPULSE_PG_DSN repository secret (Neon direct endpoint, not -pooler).

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily, before the Databricks refresh at 04:30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mastr-simulator
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Simulate one day of register changes
        env:
          GRIDPULSE_PG_DSN: ${{ secrets.GRIDPULSE_PG_DSN }}
          PYTHONUNBUFFERED: "1"
        run: python -m ingestion.batch.mastr_simulator
