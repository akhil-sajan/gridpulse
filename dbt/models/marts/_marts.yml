version: 2

models:
  - name: dim_time
    description: >
      One row per 15-minute interval. Keys are UTC; German local attributes come from
      Europe/Berlin, so local days have 92, 96 or 100 quarter-hours.
    columns:
      - name: time_key
        description: UTC interval start as yyyyMMddHHmm.
        data_tests: [unique, not_null]
      - name: ts_utc
        description: Interval start in UTC.
        data_tests: [unique, not_null]
      - name: ts_local
        description: Interval start in German local time (Europe/Berlin), no time zone.
      - name: local_date
        description: German calendar date of the interval.
      - name: local_weekday
        description: 1 = Monday ... 7 = Sunday (German local time).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: is_public_holiday_de
        description: True on nationwide German public holidays.
      - name: is_summer_time
        description: True while Germany is on summer time (UTC+2).

  - name: dim_production_type
    description: Power sources as SMARD reports them, with category and flags.
    columns:
      - name: production_type_key
        description: Surrogate key (hash of series_name).
        data_tests: [unique, not_null]
      - name: series_name
        data_tests: [unique, not_null]
      - name: category
        description: renewable, fossil, nuclear or storage.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [renewable, fossil, nuclear, storage]
      - name: is_renewable
        data_tests: [not_null]

  - name: dim_region
    description: >
      The 16 German federal states (one weather point each), Germany as a whole ('de') and
      the offshore zone in the North and Baltic Seas ('de_awz', no weather point).
    columns:
      - name: region_key
        description: Surrogate key (hash of region_code).
        data_tests: [unique, not_null]
      - name: region_code
        description: de_<state> for states, de for Germany.
        data_tests: [unique, not_null]

  - name: fact_generation
    description: Electricity generation per 15-minute interval and production type (MWh).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time_key, production_type_key]
    columns:
      - name: time_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: production_type_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_production_type')
                field: production_type_key
      - name: mwh
        description: Energy generated in the interval (MWh).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: fact_consumption
    description: Grid load and residual load per 15-minute interval (MWh).
    columns:
      - name: time_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: grid_load_mwh
        description: Total electricity consumption including grid losses (MWh).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "grid_load_mwh IS NOT NULL"
      - name: residual_load_mwh
        description: Grid load minus wind and solar generation (MWh); can be negative.

  - name: fact_price
    description: Day-ahead price DE-LU per 15-minute interval (EUR/MWh).
    columns:
      - name: time_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: price_eur_mwh
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -500
                max_value: 4000
      - name: price_resolution
        description: quarterhour = SMARD's 15-minute price; hour = hourly price applied to all four quarter-hours.
        data_tests:
          - accepted_values:
              arguments:
                values: [quarterhour, hour]

  - name: fact_weather
    description: >
      Hourly weather per region: 16 state points and the Germany-wide value, weighted by
      installed solar (radiation, cloud cover) and onshore wind capacity (wind speed).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time_key, region_key]
    columns:
      - name: time_key
        description: First 15-minute time_key of the hour.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: region_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key
      - name: cloud_cover_pct
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                row_condition: "cloud_cover_pct IS NOT NULL"

  - name: agg_renewable_share_daily
    description: >
      Business question 1. One row per German (Europe/Berlin) calendar day: generation by
      category, renewable share of generation and of load, daily prices and how many
      quarter-hours had a negative price. is_complete_day is false for days that are
      still filling (today) or before the data starts.
    columns:
      - name: local_date
        description: German calendar date.
        data_tests: [unique, not_null]
      - name: renewable_share
        description: Renewable generation divided by total generation (0-1).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "renewable_share IS NOT NULL"
      - name: renewable_share_of_load
        description: >
          Renewable generation divided by grid load. Can exceed 1 when Germany produces
          more renewable power than it consumes (the rest is exported or stored).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "renewable_share_of_load IS NOT NULL"
      - name: negative_price_quarter_hours
        description: Number of quarter-hours that day with a day-ahead price below 0 EUR/MWh.
      - name: is_complete_day
        description: True when generation exists for every quarter-hour of the local day (92, 96 or 100).
        data_tests: [not_null]

  - name: agg_negative_price_hours
    description: >
      Business question 2. One row per UTC hour in which at least one quarter-hour had a
      negative day-ahead price, with what was generating and the weather at that time.
    columns:
      - name: hour_time_key
        description: time_key of the hour's first quarter-hour (UTC, yyyyMMddHHmm).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: min_price_eur_mwh
        description: Lowest price in the hour (always below 0 here).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                max_value: 0
                strictly: true
      - name: negative_quarter_hours
        description: How many of the hour's four quarter-hours had a negative price (1-4).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 4
      - name: renewable_share
        description: Renewable share of generation in that hour (0-1).

  - name: fact_installed_capacity
    description: >
      Installed capacity (MW) at the end of each month since 2020, per region (16 states
      and the offshore zone) and production type, from the MaStR register. Storage units
      are not included (batteries and pumped hydro are not separated in the loaded fields).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_key, region_key, production_type_key]
    columns:
      - name: month_key
        description: yyyyMM of the month; capacity is the state at month_end.
        data_tests: [not_null]
      - name: region_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key
      - name: production_type_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_production_type')
                field: production_type_key
      - name: installed_mw
        description: Installed net capacity at month end (MW).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: small_units_mw
        description: Part of installed_mw from units below 100 kW (summed, not one by one).
      - name: simulated_mw
        description: Part of installed_mw from units whose current state comes from the simulator.

  - name: agg_market_hourly
    description: >
      One row per UTC hour with a day-ahead price (all hours): average and minimum price,
      generation, renewable share and grid load, with Berlin local hour and a
      weekend/holiday flag. Feeds the dashboard's market and load charts.
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: avg_price_eur_mwh
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -500
              max_value: 4000
      - name: renewable_share
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
