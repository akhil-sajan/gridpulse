name: Stream energy-charts to Kafka

# P4.3: live producer for topic energy.generation.v1 (Redpanda Serverless).
# Starts every hour and polls energy-charts every 5 minutes for about 55 minutes.
# GitHub's scheduler is best-effort: on the first night only 1 of ~8 hourly runs started.
# So each run looks back 24 hours: any run that happens fills the gaps left by dropped
# ones. Event IDs are deterministic, so the re-sent events are dropped in silver (P4.5).
# Transport (P4.7): repository variable GRIDPULSE_STREAM_TRANSPORT = kafka (default) or
# file. "kafka" needs secrets GRIDPULSE_KAFKA_BOOTSTRAP/USERNAME/PASSWORD; "file" writes
# micro-batch files to the landing volume and needs DATABRICKS_HOST/TOKEN.
# Switch to "file" before the Redpanda cluster is deleted.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      polls:
        description: Number of polls (5 minutes apart)
        default: "12"
      python:
        description: Python version (for troubleshooting)
        default: "3.11"
      debug:
        description: Log every Kafka protocol step
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stream-energy-charts
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRIDPULSE_KAFKA_BOOTSTRAP: ${{ secrets.GRIDPULSE_KAFKA_BOOTSTRAP }}
      GRIDPULSE_KAFKA_SECURITY: SASL_SSL
      GRIDPULSE_KAFKA_USERNAME: ${{ secrets.GRIDPULSE_KAFKA_USERNAME }}
      GRIDPULSE_KAFKA_PASSWORD: ${{ secrets.GRIDPULSE_KAFKA_PASSWORD }}
      GRIDPULSE_STREAM_TRANSPORT: ${{ vars.GRIDPULSE_STREAM_TRANSPORT || 'kafka' }}
      GRIDPULSE_ENV: dev
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      PYTHONUNBUFFERED: "1"
      GRIDPULSE_KAFKA_DEBUG: ${{ inputs.debug && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python || '3.11' }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Poll energy-charts every 5 minutes
        run: python -m ingestion.producers.energy_charts --interval 300 --lookback-hours 24 --max-polls ${{ inputs.polls || '12' }}
